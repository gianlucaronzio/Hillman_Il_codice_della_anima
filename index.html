["Cap. VII · Fumetti e fantasia","Nutrire la ghianda: *immaginazione* e *fantasie dei genitori*",["Che cosa alimenta l’anima? Non solo le materie “utili”: contano *fumetti*, storie, *fantasia*","Un tempo esisteva un *canone* di formazione condivisa; oggi la scelta è più incerta","I genitori proiettano *fantasie* sul figlio (il caso di *Ingrid Bergman*)","Possono *sostenere* o soffocare il destino del bambino"]],

["Cap. IX · Telos e accidenti", "*Telos* e *accidenti*", ["*Telos*: la vita è attratta da un *fine*, non solo spinta da cause passate", "La ghianda *incorpora* gli accidenti (Bette Davis, Churchill, Barrie, Thurber)", "Come un *timoniere*, il daimon compie continui *aggiustamenti*", "Il *carattere* è il *destino*"]],

["Cap. X · Otto spiegazioni", "Le *otto spiegazioni* del male", ["*Traumi infantili*, *tara ereditaria*, *ethos del gruppo*, *meccanismo della scelta*", "*Karma* e *Zeitgeist*, *Ombra*, *lacuna*", "L’ottava: la *chiamata del demonio*, cioè il daimon stesso", "Le prime sette spiegano una parte, l’ottava rimette al centro il *daimon*"]],
